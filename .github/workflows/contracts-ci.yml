name: LitBazaar contract checks
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/**"
      - "hardhat.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/contracts-ci.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/**"
      - "hardhat.config.ts"
      - "package.json"
      - "package-lock.json"
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
