name: LitBazaar sale-window factory upgrade

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPGRADE_LITBAZAAR_SALE_WINDOW to authorize the on-chain upgrade'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: litbazaar-sale-window-factory-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    if: ${{ inputs.confirm == 'UPGRADE_LITBAZAAR_SALE_WINDOW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Run full regression and upgrade tests
        run: npm test
      - name: Execute guarded factory and NFT implementation upgrade
        env:
          LITEFORGE_RPC_URL: ${{ secrets.LITEFORGE_RPC_URL }}
          LITEFORGE_PRIVATE_KEY: ${{ secrets.LITEFORGE_PRIVATE_KEY }}
        run: |
          test -n "$LITEFORGE_RPC_URL" || (echo "Missing GitHub Actions secret LITEFORGE_RPC_URL" && exit 1)
          test -n "$LITEFORGE_PRIVATE_KEY" || (echo "Missing GitHub Actions secret LITEFORGE_PRIVATE_KEY" && exit 1)
          npx hardhat run scripts/upgrade-sale-window-factory.ts --network liteforge
